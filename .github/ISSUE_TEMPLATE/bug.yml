name: 버그 보고
description: 재현 조건과 기대 동작을 기록합니다.
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 입력, 실행 명령, 발생 순서를 적습니다. 토큰은 제거해주세요.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 기대 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경과 로그
      description: OS, Python/Node 버전과 비밀 정보를 제거한 로그를 적습니다.
